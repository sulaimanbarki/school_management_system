name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.barkisoft.com
        username: school@barkisoft.com
        password: "${{ secrets.FTP_PASSWORD || '-q1y~;frg0I@xSY$' }}"
        port: 21
        server-dir: ./
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          .github/**
          .env
          storage/logs/**
          storage/framework/cache/**
          storage/framework/sessions/**
          storage/framework/views/**
          tests/**
          .phpunit.result.cache
          error_log
